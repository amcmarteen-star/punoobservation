{# Mini map: the barangay outline and its sites. Include it in a page's
   extra_scripts block, after leaflet.js. Needs `geometry` (or None) and
   `d.points` from the route. #}
<script>
  window.DASH_MAP = {{ {"geometry": geometry, "points": d.points}|tojson }};
</script>
<style>
  .dash-approx { display: inline-block; transform: translate(-50%, -50%); white-space: nowrap;
                 padding: 2px 8px; border-radius: 999px; background: rgba(255,255,255,0.85);
                 border: 2.5px solid #1b5e20; color: #14532d; font-size: 0.72rem; font-weight: 700; }
  .dash-approx.is-home { border-color: #0b2e13; border-width: 3.5px; }
  .dash-map-key [hidden] { display: none !important; }
</style>
<script>
  (function () {
    var el = document.getElementById("dash-map");
    if (!el || !window.L) return;
    var data = window.DASH_MAP || {};
    var map = L.map(el, { scrollWheelZoom: false, attributionControl: false });
    var bounds = null;

    function extend(b) {
      bounds = bounds ? bounds.extend(b) : L.latLngBounds(b);
    }

    if (data.geometry) {
      var outline = L.geoJSON(data.geometry, {
        style: { color: "#2e7d32", weight: 2, fillOpacity: 0.06 }
      }).addTo(map);
      extend(outline.getBounds());
    }
    // Solid dot: the site's real position. Hollow ring with "N sites":
    // sites with no coordinates, at their barangay centre. Own barangay:
    // a dark outline ring. Never orange (orange means below target).
    (data.points || []).forEach(function (p) {
      var ring = p.home ? "#0b2e13" : "#1b5e20";
      if (p.approx) {
        var text = p.count + (p.count === 1 ? " site" : " sites");
        L.marker([p.lat, p.lon], { icon: L.divIcon({
          className: "",
          html: '<span class="dash-approx' + (p.home ? ' is-home' : '') + '">' + text + '</span>',
          iconSize: null
        }) }).bindTooltip(p.name + ": " + text + ", approximate location (barangay centre)"
                          + (p.home ? ", your barangay" : "")).addTo(map);
      } else {
        L.circleMarker([p.lat, p.lon], p.home
          ? { radius: 9, color: ring, weight: 3, fillColor: "#43a047", fillOpacity: 0.9 }
          : { radius: 6, color: ring, weight: 2, fillColor: "#43a047", fillOpacity: 0.9 }
        ).bindTooltip(p.name + (p.home ? " (your barangay)" : "")).addTo(map);
      }
      extend([[p.lat, p.lon]]);
    });

    var key = document.getElementById("dash-map-key");
    if (key) {
      var pts = data.points || [];
      [["exact", pts.some(function (p) { return !p.approx; })],
       ["approx", pts.some(function (p) { return p.approx; })],
       ["home", pts.some(function (p) { return p.home; })]].forEach(function (k) {
        var item = key.querySelector('[data-key="' + k[0] + '"]');
        if (item) item.hidden = !k[1];
      });
      if (pts.length) key.style.display = "flex";
    }

    if (bounds) {
      map.fitBounds(bounds, { padding: [12, 12] });
    } else {
      map.setView([15.9, 120.6], 10);
    }
  })();
</script>
